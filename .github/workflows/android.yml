name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 # Pin to specific version to try and avoid runner availability delay

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          # Ensure capacitor is installed globally if needed, though npx should work
          npm install -g @capacitor/cli

      - name: Build Web App
        run: npm run build

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Build Android APK
        run: |
          npm run build
          npx cap sync android
          cd android
          # Ensure gradlew exists to avoid common Capacitor sync issues in CI
          if [ ! -f gradlew ]; then
            echo "gradlew missing, generating with gradle wrapper..."
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          # Locate the APK for the upload step
          ls -R app/build/outputs/apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
